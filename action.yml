name: "Rebuild Armbian"
author: "https://github.com/momokind/armbian-build"
description: "Build Armbian Linux"
inputs:

  armbian_token:
    description: "GitHub installation access token"
    required: true

  armbian_runner_clean:
    description: "Make some space on GH runners"
    required: false
    default: ""

  armbian_artifacts:
    descriptions: "Upload PATH"
    required: false
    default: "build/output/images/"

  armbian_target:
    description: "Build image or kernel"
    required: false
    default: "kernel"

  armbian_branch:
    description: "Choose framework branch"
    required: false
    default: "main"

  armbian_kernel_branch:
    description: "Choose kernel branch"
    required: false
    default: "current"

  armbian_release:
    description: "Choose userspace release"
    required: false
    default: "jammy"

  armbian_version:
    description: "Set different version"
    required: false
    default: ""

  armbian_board:
    description: "Select hardware platform"
    required: false
    default: "uefi-x86"

  armbian_ui:
    description: "Armbian user interface"
    required: false
    default: "server"

  armbian_compress:
    description: "Armbian compress method"
    required: false
    default: "sha,img,xz"

  armbian_extensions:
    description: "Armbian lists of extensions"
    required: false
    default: ""

  armbian_userpatches:
    description: "Armbian userpatches path"
    required: false
    default: ""

  armbian_pgp_key:
    description: "Armbian PGP key"
    required: false
    default: ""

  armbian_pgp_password:
    description: "Armbian PGP password"
    required: false
    default: ""

  armbian_release_tittle:
    description: "Armbian image"
    required: false
    default: "Armbian image"

  armbian_release_body:
    description: "Armbian images"
    required: false
    default: "Build with [Armbian tools](https://github.com/momokind/armbian-build)"

runs:
  using: "composite"

  steps:

    - name: Free Github Runner
      if: ${{ inputs.armbian_runner_clean != '' }}
      uses: descriptinc/free-disk-space@main
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: "Import GPG key"
      if: ${{ inputs.armbian_pgp_key != '' }}
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ inputs.armbian_pgp_key }}
        passphrase: ${{ inputs.armbian_pgp_password }}

    - name: "Checkout Armbian os"
      uses: actions/checkout@v4
      with:
        repository: armbian/os
        fetch-depth: 0
        clean: false
        path: os

    - name: "Checkout Armbian build framework"
      uses: actions/checkout@v4
      with:
        repository: momokind/armbian-build
        fetch-depth: 0
        clean: false
        path: build

    - name: "Checkout customisations"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: false
        path: custom

    - shell: bash
      run: |

        # read version from upstream Armbian OS
        cat os/stable.json | jq '.version' | sed "s/\"//g" | sed 's/^/ARMBIAN_VERSION=/' >> $GITHUB_ENV
        [[ "${{ inputs.armbian_version }}" != '' ]] && echo "ARMBIAN_VERSION=${{ inputs.armbian_version }}" >> $GITHUB_ENV

        # copy os userpatches and custom
        mkdir -pv build/userpatches
        rsync -av os/userpatches/. build/userpatches/
        [[ -d custom/userpatches ]] && rsync -av custom/userpatches/. build/userpatches/

        # copy custom board configs
        [[ -d custom/config/boards ]] && rsync -av custom/config/boards/. build/config/boards/
        # copy custom kernel configs
        [[ -d custom/config/kernel ]] && rsync -av custom/config/kernel/. build/config/kernel/
        # copy custom bootenv
        [[ -d custom/config/bootenv ]] && rsync -av custom/config/bootenv/. build/config/bootenv/
        # copy custom bootscripts (z96a-specific boot.cmd must be deployed for vdd_npu init)
        [[ -d custom/config/bootscripts ]] && rsync -av custom/config/bootscripts/. build/config/bootscripts/
        # copy custom sources
        [[ -d custom/config/sources ]] && rsync -av custom/config/sources/. build/config/sources/
        # copy custom patches
        [[ -d custom/patch ]] && rsync -av custom/patch/. build/patch/
        # copy custom lib overrides (for build framework fixes that need
        # to be in momokind/armbian-build's lib/, e.g. rootfs/debootstrap
        # keyring workarounds). Only files present in custom/lib/ are
        # copied; existing momokind files not overridden are kept.
        [[ -d custom/lib ]] && rsync -av custom/lib/. build/lib/
        # remove stale patches superseded by kernel-fork commits (rk817 battery IIO
        # support lives in kemp233/linux-rockchip rk-6.1-rkr5.1; the stale copy in
        # the build framework fork double-applies and breaks kernel patching)
        rm -fv build/patch/kernel/rockchip-rk3568-z96a/legacy/z96a-rk817.patch
        # copy custom extensions
        [[ -d custom/extensions ]] && rsync -av custom/extensions/. build/extensions/
        # copy custom packages (including blobs)
        [[ -d custom/packages ]] && rsync -av custom/packages/. build/packages/

    - name: "Compile rockchip-vaapi (mpp + librga + libva-rockchip)"
      if: ${{ contains(inputs.armbian_extensions, 'rockchip-vaapi') }}
      shell: bash
      run: |
        set -e
        echo "::group::Install cross toolchain"
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            meson ninja-build cmake pkg-config \
            libdrm-dev:arm64 libva-dev:arm64 \
            qemu-user-static binfmt-support
        sudo update-binfmts --enable qemu-aarch64
        echo "::endgroup::"

        STAGE="$GITHUB_WORKSPACE/build/output/rockchip-vaapi"
        rm -rf "$STAGE"
        mkdir -p "$STAGE/usr/lib/aarch64-linux-gnu/dri" "$STAGE/src"

        cd "$STAGE/src"

        # 1) Build Rockchip MPP (static for cross-compile simplicity)
        echo "::group::Build mpp"
        if [[ ! -d mpp ]]; then
          git clone --depth 1 https://github.com/rockchip-linux/mpp.git
        fi
        cd mpp
        mkdir -p build && cd build
        cmake -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=/usr/lib/aarch64-linux-gnu \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TEST=OFF \
              -DBUILD_SHARED_LIBS=ON .. 2>&1 | tail -5
        make -j"$(nproc)" 2>&1 | tail -3
        make DESTDIR="$STAGE" install 2>&1 | tail -3
        cd ../..
        echo "::endgroup::"

        # 2) Build librga
        echo "::group::Build librga"
        if [[ ! -d librga ]]; then
          git clone --depth 1 https://github.com/airockchip/librga.git
        fi
        cd librga
        PKG_CONFIG_PATH="$STAGE/usr/lib/aarch64-linux-gnu/pkgconfig" \
        meson setup build \
            --prefix=/usr \
            --libdir=lib/aarch64-linux-gnu \
            --cross-file <(cat <<EOF
[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkgconfig = 'aarch64-linux-gnu-pkg-config'
[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
EOF
) 2>&1 | tail -5
        ninja -C build 2>&1 | tail -3
        DESTDIR="$STAGE" ninja -C build install 2>&1 | tail -3
        cd ..
        echo "::endgroup::"

        # 3) Build libva-rockchip (the wrapper that produces rockchip_drv_video.so)
        echo "::group::Build libva-rockchip"
        if [[ ! -d libva-rockchip ]]; then
          git clone --depth 1 https://github.com/jeffy-cn/libva-rockchip.git
        fi
        cd libva-rockchip
        PKG_CONFIG_PATH="$STAGE/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig" \
        meson setup build \
            --prefix=/usr \
            --libdir=lib/aarch64-linux-gnu \
            --cross-file <(cat <<EOF
[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkgconfig = 'aarch64-linux-gnu-pkg-config'
[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
[properties]
rootprefix = '/usr'
[built-in options]
libdir = 'lib/aarch64-linux-gnu'
EOF
) 2>&1 | tail -5
        ninja -C build 2>&1 | tail -3
        DESTDIR="$STAGE" ninja -C build install 2>&1 | tail -3
        cd ..
        echo "::endgroup::"

        echo "::group::Verify staged files"
        find "$STAGE" -name '*.so*' -type f -o -name '*.so*' -type l | head -20
        echo "::endgroup::"

    - shell: bash
      run: |

        # userspace decode
        if [[ "${{ inputs.armbian_ui }}" == minimal ]]; then
          BUILD_DESKTOP="no"
          BUILD_MINIMAL="yes"
        elif [[ "${{ inputs.armbian_ui }}" == server ]]; then
          BUILD_DESKTOP="no"
          BUILD_MINIMAL="no"
        else
          BUILD_DESKTOP="yes"
          BUILD_MINIMAL="no"
          DESKTOP_ENVIRONMENT="${{ inputs.armbian_ui }}"
          DESKTOP_APPGROUPS_SELECTED=""
          DESKTOP_ENVIRONMENT_CONFIG_NAME="config_base"
        fi

        # go to build folder and checkout
        cd build
        git checkout ${{ inputs.armbian_branch }}

        # execute build command
        ./compile.sh "${{ inputs.armbian_target }}" \
        REVISION="${{ env.ARMBIAN_VERSION }}" \
        BOARD="${{ inputs.armbian_board }}" \
        BRANCH="${{ inputs.armbian_kernel_branch }}" \
        RELEASE="${{ inputs.armbian_release }}" \
        KERNEL_CONFIGURE="no" \
        BUILD_DESKTOP="${BUILD_DESKTOP}" \
        BUILD_MINIMAL="${BUILD_MINIMAL}" \
        DESKTOP_ENVIRONMENT="${DESKTOP_ENVIRONMENT}" \
        DESKTOP_APPGROUPS_SELECTED="${DESKTOP_APPGROUPS_SELECTED}" \
        DESKTOP_ENVIRONMENT_CONFIG_NAME="${DESKTOP_ENVIRONMENT_CONFIG_NAME}" \
        ENABLE_EXTENSIONS="${{ inputs.armbian_extensions }}" \
        COMPRESS_OUTPUTIMAGE="${{ inputs.armbian_compress }}" \
        SHARE_LOG="yes" \
        EXPERT="yes"

    - name: Sign
      shell: bash
      if: ${{ inputs.armbian_pgp_password != '' }}
      run: |
        echo ${{ inputs.armbian_pgp_password }} | \
        gpg --passphrase-fd 0 --armor --detach-sign --pinentry-mode loopback --batch --yes \
        build/output/images/*.img*.xz

    - uses: ncipollo/release-action@v1
      with:
        tag: "${{ env.ARMBIAN_VERSION }}"
        name: "${{ inputs.armbian_release_tittle }}"
        artifacts: "${{ inputs.armbian_artifacts }}*"
        allowUpdates: true
        removeArtifacts: false
        replacesArtifacts: true
        makeLatest: true
        token: "${{ inputs.armbian_token }}"
        body: |
          ${{ inputs.armbian_release_body }}

branding:
  icon: "check"
  color: "red"

